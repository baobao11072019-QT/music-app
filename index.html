<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Music App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🎵 Music App</h2>

<!-- Chọn thể loại -->
<select id="genreSelect">
  <option value="all">Tất cả thể loại</option>
</select>

<!-- Chế độ phát -->
<div class="mode">
  <label>
    <input type="radio" name="playMode" value="order" checked>
    Phát theo thứ tự
  </label>
  <label>
    <input type="radio" name="playMode" value="single">
    Chỉ 1 bài
  </label>
</div>

<p id="song-title">Chưa phát</p>

<audio id="audio" controls></audio>

<ul id="playlist"></ul>

<script src="script.js"></script>
</body>
</html>
